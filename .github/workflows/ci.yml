# CI for every pull request and push to main.
#
# Data-residency rule: hosted runners may be outside the approved region, so these jobs use
# synthetic data only and hold no production secrets. Deployment jobs (added once hosting is
# approved, ADR-001) must run on self-hosted runners in-region.
#
# Registry: @sirius/* packages (js-platform) install from the private registry. Set the
# repository variables SIRIUS_REGISTRY (e.g. https://registry.example/) and SIRIUS_REGISTRY_HOST
# (e.g. registry.example/) and the secret SIRIUS_REGISTRY_TOKEN. A hosted runner cannot reach the
# local Verdaccio; this pipeline runs once the approved registry and runners exist (ADR-001).
#
# Supply chain: third-party actions are referenced by version tag for now; pin each to a full
# commit SHA before the first deployment pipeline is added (tracked in SECURITY.md).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  HUSKY: '0'

jobs:
  verify:
    name: Format, lint, typecheck, test (100% coverage), build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # packages/db integration tests prove Row-Level Security against a real, throwaway database.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://peopleforge_app:ci-only-app@localhost:5432/peopleforge_test
      TEST_DATABASE_OWNER_URL: postgres://peopleforge_owner:ci-only-owner@localhost:5432/peopleforge_test
      TEST_DATABASE_WORKER_URL: postgres://peopleforge_worker:ci-only-worker@localhost:5432/peopleforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Point @sirius/* at the private registry
        run: |
          npm config set --location=project "@sirius:registry=${SIRIUS_REGISTRY}"
          npm config set --location=user "//${SIRIUS_REGISTRY#*://}:_authToken=${SIRIUS_REGISTRY_TOKEN}"
        env:
          SIRIUS_REGISTRY: ${{ vars.SIRIUS_REGISTRY }}
          SIRIUS_REGISTRY_TOKEN: ${{ secrets.SIRIUS_REGISTRY_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Create the test database and roles
        env:
          PGPASSWORD: ci-only-postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE peopleforge_owner LOGIN PASSWORD 'ci-only-owner';
          CREATE ROLE peopleforge_app LOGIN PASSWORD 'ci-only-app';
          CREATE ROLE peopleforge_worker LOGIN PASSWORD 'ci-only-worker';
          CREATE DATABASE peopleforge_test OWNER peopleforge_owner;
          REVOKE CONNECT ON DATABASE peopleforge_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE peopleforge_test TO peopleforge_app, peopleforge_worker;
          SQL
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/*/coverage
          retention-days: 14

  dependencies:
    name: Dependency audit (fail on high/critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Point @sirius/* at the private registry
        run: |
          npm config set --location=project "@sirius:registry=${SIRIUS_REGISTRY}"
          npm config set --location=user "//${SIRIUS_REGISTRY#*://}:_authToken=${SIRIUS_REGISTRY_TOKEN}"
        env:
          SIRIUS_REGISTRY: ${{ vars.SIRIUS_REGISTRY }}
          SIRIUS_REGISTRY_TOKEN: ${{ secrets.SIRIUS_REGISTRY_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # Accepted exceptions live in pnpm-workspace.yaml (auditConfig) and SECURITY.md.
      - run: pnpm audit --audit-level high
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: --lockfile=pnpm-lock.yaml

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.130.0
    steps:
      - uses: actions/checkout@v4
      # Local rulesets only: no code is uploaded to the Semgrep cloud.
      - run: >-
          semgrep scan --error --metrics=off
          --config p/typescript --config p/nodejs --config p/react
          --config p/owasp-top-ten --config p/secrets
          --severity ERROR
          --exclude '**/*.test.ts' --exclude '**/*.test.tsx'

  e2e:
    name: E2E (Playwright)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Synthetic data only: a throwaway database and a test OpenID provider started by Playwright.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://peopleforge_app:ci-only-app@localhost:5432/peopleforge_test
      E2E_DATABASE_OWNER_URL: postgres://peopleforge_owner:ci-only-owner@localhost:5432/peopleforge_test
      E2E_DATABASE_WORKER_URL: postgres://peopleforge_worker:ci-only-worker@localhost:5432/peopleforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Point @sirius/* at the private registry
        run: |
          npm config set --location=project "@sirius:registry=${SIRIUS_REGISTRY}"
          npm config set --location=user "//${SIRIUS_REGISTRY#*://}:_authToken=${SIRIUS_REGISTRY_TOKEN}"
        env:
          SIRIUS_REGISTRY: ${{ vars.SIRIUS_REGISTRY }}
          SIRIUS_REGISTRY_TOKEN: ${{ secrets.SIRIUS_REGISTRY_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Create the test database and roles
        env:
          PGPASSWORD: ci-only-postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE peopleforge_owner LOGIN PASSWORD 'ci-only-owner';
          CREATE ROLE peopleforge_app LOGIN PASSWORD 'ci-only-app';
          CREATE ROLE peopleforge_worker LOGIN PASSWORD 'ci-only-worker';
          CREATE DATABASE peopleforge_test OWNER peopleforge_owner;
          REVOKE CONNECT ON DATABASE peopleforge_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE peopleforge_test TO peopleforge_app, peopleforge_worker;
          SQL
      - run: pnpm --filter @peopleforge/web exec playwright install --with-deps chromium webkit msedge
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  images:
    name: Build container images
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        app: [api, web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: false
          load: true
          build-args: SIRIUS_REGISTRY=${{ vars.SIRIUS_REGISTRY }}
          secrets: |
            npmrc=${{ format('//{0}:_authToken={1}', vars.SIRIUS_REGISTRY_HOST, secrets.SIRIUS_REGISTRY_TOKEN) }}
          tags: peopleforge-${{ matrix.app }}:${{ github.sha }}
      - name: Scan image (fail on high/critical)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: peopleforge-${{ matrix.app }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
