openapi: 3.1.0
info:
  title: PeopleForge API
  version: 0.3.0
  description: >
    Phase 1 API (BRD SIRIUS-HR-BRD-001). Every /api/v1 route requires an access token from the
    Sirius identity provider (Microsoft Entra ID; Keycloak locally) sent as
    `Authorization: Bearer <token>`. Tokens must be issued for this API (audience), by the
    configured issuer and tenant, and unexpired; anything else is 401. When the identity
    provider cannot be reached the API answers 503 so clients retry.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: health
  - name: identity
paths:
  /health/live:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liveness' }
  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: 503 when any dependency is down or the instance is shutting down.
      security: []
      responses:
        '200':
          description: Ready for traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /api/v1/me:
    get:
      tags: [identity]
      summary: Current caller's identity, data scope and effective permissions (R1-01, R2-12)
      responses:
        '200':
          description: Authenticated principal with permissions derived from its roles
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Principal' }
                  - type: object
                    required: [permissions]
                    properties:
                      permissions:
                        type: array
                        items: { type: string, example: 'increment_request:decide' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/IdentityProviderUnavailable' }
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        OIDC access token for audience `OIDC_AUDIENCE`, issued by `OIDC_ISSUER` (Entra ID in
        production, pending Sirius IT, A6; Keycloak locally). Roles come from the `roles` claim.
  headers:
    RequestId:
      description: Correlation ID, echoed or generated per request.
      schema: { type: string }
  responses:
    IdentityProviderUnavailable:
      description: The identity provider's signing keys could not be loaded; retry later
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthenticated:
      description: Missing, malformed, expired or foreign access token
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    Liveness:
      type: object
      required: [status]
      properties:
        status: { type: string, const: alive }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [up, down] }
    Principal:
      oneOf:
        - type: object
          required: [userId, username, name, roles, scope]
          properties:
            userId: { type: string, description: Identity-provider object ID (Entra oid) }
            username: { type: [string, 'null'] }
            name: { type: [string, 'null'] }
            roles: { type: array, items: { type: string } }
            scope: { type: string, const: group }
        - type: object
          required: [userId, username, name, roles, scope, entityIds]
          properties:
            userId: { type: string, description: Identity-provider object ID (Entra oid) }
            username: { type: [string, 'null'] }
            name: { type: [string, 'null'] }
            roles: { type: array, items: { type: string } }
            scope: { type: string, const: entity }
            entityIds: { type: array, items: { type: string } }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, messageKey, requestId]
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION_FAILED,
                  UNAUTHENTICATED,
                  FORBIDDEN,
                  NOT_FOUND,
                  CONFLICT,
                  PAYLOAD_TOO_LARGE,
                  RATE_LIMITED,
                  SERVICE_UNAVAILABLE,
                  INTERNAL_ERROR,
                ]
            messageKey: { type: string, example: errors.UNAUTHENTICATED }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                required: [path, code]
                properties:
                  path: { type: string }
                  code: { type: string }
