        messages; at most 500. Details carry IDs, codes and counts only, never pay or text.
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: The entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/audit:
    get:
      tags: [audit]
      summary: The whole audit trail, newest first (R1-15)
      description: >
        Needs `audit:read` (Sirius HR reviewers, admins). `actor` is one user's ID; `search`
        matches the actor's name or ID or the action; `from` and `to` are inclusive dates in
        Asia/Dubai.
      parameters:
        - { name: actor, in: query, schema: { type: string, maxLength: 128 } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50], default: 25 } }
      responses:
        '200':
          description: A page of entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditTrailPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
