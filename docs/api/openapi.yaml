openapi: 3.1.0
info:
  title: PeopleForge API
  version: 0.6.0
  description: >
    Phase 1 API (BRD SIRIUS-HR-BRD-001). Every /api/v1 route requires an access token from the
    Sirius identity provider (Microsoft Entra ID; Keycloak locally) sent as
    `Authorization: Bearer <token>`. Tokens must be issued for this API (audience), by the
    configured issuer and tenant, and unexpired; anything else is 401. When the identity
    provider cannot be reached the API answers 503 so clients retry.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: increment-requests
    description: R1 Increment Request Portal
  - name: notifications
    description: In-app notifications (R1-07, R1-13)
  - name: health
  - name: identity
paths:
  /health/live:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liveness' }
  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: 503 when any dependency is down or the instance is shutting down.
      security: []
      responses:
        '200':
          description: Ready for traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /api/v1/me:
    get:
      tags: [identity]
      summary: Current caller's identity, data scope, visible subsidiaries and effective permissions (R1-01, R2-12)
      responses:
        '200':
          description: Authenticated principal with permissions derived from its roles
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Principal' }
                  - type: object
                    required: [permissions, entities]
                    properties:
                      permissions:
                        type: array
                        items: { type: string, example: 'increment_request:decide' }
                      entities:
                        description: Subsidiaries the caller can see (all for Sirius roles), ordered by code
                        type: array
                        items: { $ref: '#/components/schemas/EntitySummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/IdentityProviderUnavailable' }
  /api/v1/increment-cycles/open:
    get:
      tags: [increment-requests]
      summary: Increment cycles open for requests (configuration, Q1)
      responses:
        '200':
          description: Open cycles, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Cycle' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/employees:
    get:
      tags: [increment-requests]
      summary: Employee picker for a request — name, number and grade, never salary (R1-02)
      description: Requires `increment_request:create`. A subsidiary user may only search their own subsidiaries (403 otherwise); Row-Level Security re-checks every row.
      parameters:
        - { name: entityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: excludeRequestId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Up to 50 active employees, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EmployeeOption' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/increment-requests:
    get:
      tags: [increment-requests]
      summary: The caller's increment requests, newest first (R1-02)
      description: Requires `increment_request:read`. Drafts are listed only for callers who can create requests; Sirius sees a request once it is submitted.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50], default: 10 } }
      responses:
        '200':
          description: A page of summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementRequestPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [increment-requests]
      summary: Create a draft request with its first employee(s) (R1-02)
      description: >
        Requires `increment_request:create`. Idempotent per user and `Idempotency-Key`: repeating the
        call returns the same draft. `entityId` is required only when the caller acts for more than
        one subsidiary. Each employee's grade and monthly salary are snapshotted.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cycleId, employeeIds]
              properties:
                cycleId: { type: string, format: uuid }
                entityId: { type: string, format: uuid }
                employeeIds:
                  { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } }
      responses:
        '201':
          description: The draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/increment-requests/{id}:
    get:
      tags: [increment-requests]
      summary: One request with derived figures and totals (R1-02)
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/increment-requests/{id}/lines:
    post:
      tags: [increment-requests]
      summary: Add an employee to a draft (snapshot of grade and salary)
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employeeId]
              properties: { employeeId: { type: string, format: uuid } }
      responses:
        '201':
          description: The updated request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/increment-requests/{id}/lines/{lineId}:
    delete:
      tags: [increment-requests]
      summary: Remove an employee from a draft (soft delete); removing the last one discards the draft
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: '`discarded: false` with the updated request, or `discarded: true` and `request: null` when the last employee was removed'
          content:
            application/json:
              schema:
                type: object
                required: [discarded, request]
                properties:
                  discarded: { type: boolean }
                  request:
                    oneOf:
                      - { $ref: '#/components/schemas/IncrementRequest' }
                      - { type: 'null' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/increment-requests/{id}/draft:
    put:
      tags: [increment-requests]
      summary: Save draft — proposals, and optionally one employee's criteria, all or nothing (R1-02, R1-03)
      description: >
        `version` must be the version last read (409 if the draft changed). A proposal value is a
        decimal string with up to 2 decimals: a percentage (above 0, at most 100) or a monthly
        amount (above 0, at most the current salary); `kind` and `value` both null clear it.
        `assessment` saves one employee's criteria: a result (`pass`, `fail` or null) and a
        justification (≤ 2,000 characters; empty clears it) per criterion of the request's set.
        Refusals name the field, e.g. `proposals.2.value` (`over_limit`, `not_positive`),
        `assessment.lineId` or `assessment.results.1.criterionId` (`not_found`).
        Replaces `PUT …/proposals` (never released).
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, proposals]
              properties:
                version: { type: integer, minimum: 1 }
                proposals:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [lineId, kind, value]
                    properties:
                      lineId: { type: string, format: uuid }
                      kind: { type: [string, 'null'], enum: [percent, amount, null] }
                      value: { $ref: '#/components/schemas/NullableDecimal' }
                assessment:
                  type: object
                  additionalProperties: false
                  required: [lineId, results]
                  properties:
                    lineId: { type: string, format: uuid }
                    results:
                      type: array
                      maxItems: 10
                      description: Each criterion at most once
                      items:
                        type: object
                        additionalProperties: false
                        required: [criterionId, result, justification]
                        properties:
                          criterionId: { type: string, format: uuid }
                          result: { type: [string, 'null'], enum: [pass, fail, null] }
                          justification: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: The updated request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/increment-requests/{id}/evidence:
    post:
      tags: [increment-requests]
      summary: Attach an evidence file to one employee's criterion (R1-04, ADR-010)
      description: >
        Needs `increment_request:create`; drafts only. The file is checked in this order and
        stored only if every check passes: employee and criterion in the request, criterion
        accepts files, at most 5 live files, size (at most 10 MB or the criterion's lower
        limit; 413), type detected from the content and in the criterion's list
        (`file`/`media_type`), malware scan (`file`/`infected`). Scanner or storage unavailable:
        503, nothing stored. Doesn't change the request's `version`.
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [lineId, criterionId, file]
              properties:
                lineId: { type: string, format: uuid }
                criterionId: { type: string, format: uuid }
                file:
                  { type: string, format: binary, description: 'One file; the name may be UTF-8' }
      responses:
        '201':
          description: The recorded file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceFile' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/IdentityProviderUnavailable' }
  /api/v1/increment-requests/{id}/evidence/{evidenceId}:
    get:
      tags: [increment-requests]
      summary: Download an evidence file (always an attachment; re-checks access every time)
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: >
            The file, with its detected `Content-Type`, `Content-Disposition: attachment`
            (`filename*` in UTF-8), `Cache-Control: private, no-store` and
            `X-Content-Type-Options: nosniff`
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/IdentityProviderUnavailable' }
    delete:
      tags: [increment-requests]
      summary: Remove an evidence file from a draft (soft delete)
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/increment-requests/{id}/submit:
    post:
      tags: [increment-requests]
      summary: Submit a draft to Sirius HR (R1-07)
      description: >
        Needs `increment_request:submit`. `version` must be the version last read (409 if the draft
        changed). Refused with 400 when an employee has no proposal or an incomplete criterion
        (`lines.N`/`incomplete`), or when the cycle's submission deadline (a business day in
        Asia/Dubai) has passed (`cycle`/`deadline_passed`). On success, in one transaction: the
        status becomes `submitted`, a status event and an audit record are written, and the
        submitter and Sirius HR reviewers are notified (in-app; email queued in the outbox).
        Idempotent per user and `Idempotency-Key`: a repeat returns the submitted request; the same
        key on another request is 409 (`Idempotency-Key`/`reused`). Submitting a request that is no
        longer a draft is 409 (`status`/`not_draft`).
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties: { version: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The submitted request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: The caller's notifications, newest first
      description: >
        Any signed-in user. Includes notifications addressed to the caller and, for Sirius roles,
        those addressed to one of the caller's roles. Params carry display values only (reference,
        counts, names) — never pay or justifications.
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, unread, action_needed], default: all }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses:
        '200':
          description: A page of notifications with the unread count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/notifications/summary:
    get:
      tags: [notifications]
      summary: The unread count for the sidebar bell
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties: { unread: { type: integer, minimum: 0 } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/notifications/read:
    post:
      tags: [notifications]
      summary: Mark notifications as read — the given ones, or all of the caller's
      description: Ids the caller can't see are ignored. Repeating the call is harmless.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids:
                  { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        '204': { description: Marked }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        OIDC access token for audience `OIDC_AUDIENCE`, issued by `OIDC_ISSUER` (Entra ID in
        production, pending Sirius IT, A6; Keycloak locally). Roles come from the `roles` claim.
  parameters:
    RequestId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  headers:
    RequestId:
      description: Correlation ID, echoed or generated per request.
      schema: { type: string }
  responses:
    IdentityProviderUnavailable:
      description: A dependency is unavailable (identity provider signing keys, the database, object storage or the malware scanner); retry later
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthenticated:
      description: Missing, malformed, expired or foreign access token
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationFailed:
      description: Input refused; `details` name the fields
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: The caller's role lacks the permission, or the subsidiary isn't theirs
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Doesn't exist, or isn't visible to the caller (another subsidiary's, or a draft for Sirius)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Stale `version`, duplicate employee, no active criteria set, the criterion's file limit reached (`file`/`limit`), a request that is no longer a draft (`status`/`not_draft`), or an `Idempotency-Key` reused for another request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PayloadTooLarge:
      description: Body or file over the limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    Decimal:
      type: string
      pattern: '^\d{1,9}(\.\d{1,2})?$'
      description: Exact decimal as a string (never a JSON number), e.g. "21500.00"
    NullableDecimal:
      type: [string, 'null']
      pattern: '^\d{1,9}(\.\d{1,2})?$'
    LocalisedText:
      type: object
      required: [en]
      properties: { en: { type: string }, ar: { type: string } }
    Cycle:
      type: object
      required: [id, name, startsOn, endsOn, submissionDeadline, status]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalisedText' }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        submissionDeadline: { type: [string, 'null'], format: date }
        status: { type: string, enum: [planned, open, closed] }
    EmployeeOption:
      type: object
      required: [id, employeeNumber, fullName, grade]
      properties:
        id: { type: string, format: uuid }
        employeeNumber: { type: string }
        fullName: { type: string }
        grade: { type: string }
    RequestLine:
      type: object
      required:
        [
          id,
          employeeId,
          employeeNumber,
          fullName,
          grade,
          currency,
          currentSalary,
          proposedKind,
          proposedValue,
          increase,
          newSalary,
          percent,
          criteria,
        ]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeNumber: { type: string }
        fullName: { type: string }
        grade: { type: string }
        currency: { type: string, example: AED }
        currentSalary: { $ref: '#/components/schemas/Decimal' }
        proposedKind: { type: [string, 'null'], enum: [percent, amount, null] }
        proposedValue: { $ref: '#/components/schemas/NullableDecimal' }
        increase: { $ref: '#/components/schemas/NullableDecimal' }
        newSalary: { $ref: '#/components/schemas/NullableDecimal' }
        percent: { $ref: '#/components/schemas/NullableDecimal' }
        criteria:
          type: array
          description: One per criterion of the request, in the same order as the request's `criteria`
          items: { $ref: '#/components/schemas/CriterionAssessment' }
    Criterion:
      type: object
      required:
        [
          id,
          code,
          name,
          description,
          justificationRequired,
          evidencePolicy,
          allowedMediaTypes,
          maxFileMb,
        ]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: C1 }
        name: { $ref: '#/components/schemas/LocalisedText' }
        description: { $ref: '#/components/schemas/LocalisedText' }
        justificationRequired: { type: boolean }
        evidencePolicy: { type: string, enum: [required, optional, none] }
        allowedMediaTypes: { type: array, items: { type: string }, example: [application/pdf] }
        maxFileMb: { type: integer, description: "Effective limit: the criterion's, capped at 10" }
    EvidenceFile:
      type: object
      required: [id, fileName, mediaType, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    CriterionAssessment:
      type: object
      required: [criterionId, result, justification, evidence, missing]
      properties:
        criterionId: { type: string, format: uuid }
        result: { type: [string, 'null'], enum: [pass, fail, null] }
        justification: { type: string }
        evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceFile' } }
        missing:
          type: array
          description: What still stops the criterion counting as complete (R1-06); empty when complete
          items: { type: string, enum: [result, justification, evidence] }
    IncrementRequest:
      type: object
      required:
        [
          id,
          reference,
          status,
          entity,
          cycle,
          criteria,
          version,
          createdAt,
          updatedAt,
          submittedAt,
          lines,
          totals,
        ]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: INC-2026-0001 }
        status: { type: string, enum: [draft, submitted] }
        entity: { $ref: '#/components/schemas/EntitySummary' }
        cycle:
          type: object
          required: [id, name, submissionDeadline]
          properties:
            id: { type: string, format: uuid }
            name: { $ref: '#/components/schemas/LocalisedText' }
            submissionDeadline:
              type: [string, 'null']
              format: date
              description: Last business day (Asia/Dubai) on which requests can be submitted
        criteria:
          type: array
          description: The criteria set pinned when the request was created (R1-05), in display order
          items: { $ref: '#/components/schemas/Criterion' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/RequestLine' } }
        totals:
          type: object
          required: [employees, proposed, ready, increaseByCurrency, averagePercent]
          properties:
            employees: { type: integer }
            proposed: { type: integer }
            ready:
              type: integer
              description: Employees with a proposal and every criterion complete
            increaseByCurrency:
              type: array
              items:
                type: object
                required: [currency, amount]
                properties:
                  { currency: { type: string }, amount: { $ref: '#/components/schemas/Decimal' } }
            averagePercent: { $ref: '#/components/schemas/NullableDecimal' }
    IncrementRequestPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            required:
              [id, reference, status, entityId, cycleId, employeeCount, createdAt, updatedAt]
            properties:
              id: { type: string, format: uuid }
              reference: { type: string }
              status: { type: string, enum: [draft, submitted] }
              entityId: { type: string, format: uuid }
              cycleId: { type: string, format: uuid }
              employeeCount: { type: integer }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, kind, requestId, params, actionNeeded, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [request_submitted, request_received]
          description: What happened; clients word it in the reader's language
        requestId: { type: [string, 'null'], format: uuid }
        params:
          type: object
          additionalProperties: { type: [string, number] }
          example: { reference: INC-2026-0005, employees: 1, entity: SUB-A, actor: Alpha HR }
        actionNeeded: { type: boolean }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    NotificationPage:
      type: object
      required: [items, page, pageSize, total, unread]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        unread: { type: integer }
    Liveness:
      type: object
      required: [status]
      properties:
        status: { type: string, const: alive }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [up, down] }
    Principal:
      oneOf:
        - type: object
          required: [userId, username, name, roles, scope]
          properties:
            userId: { type: string, description: Identity-provider object ID (Entra oid) }
            username: { type: [string, 'null'] }
            name: { type: [string, 'null'] }
            roles: { type: array, items: { type: string } }
            scope: { type: string, const: group }
        - type: object
          required: [userId, username, name, roles, scope, entityIds]
          properties:
            userId: { type: string, description: Identity-provider object ID (Entra oid) }
            username: { type: [string, 'null'] }
            name: { type: [string, 'null'] }
            roles: { type: array, items: { type: string } }
            scope: { type: string, const: entity }
            entityIds: { type: array, items: { type: string } }
    EntitySummary:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: SUB-A }
        name:
          type: object
          description: Localised names keyed by locale; `en` always present
          required: [en]
          additionalProperties: { type: string }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, messageKey, requestId]
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION_FAILED,
                  UNAUTHENTICATED,
                  FORBIDDEN,
                  NOT_FOUND,
                  CONFLICT,
                  PAYLOAD_TOO_LARGE,
                  RATE_LIMITED,
                  SERVICE_UNAVAILABLE,
                  INTERNAL_ERROR,
                ]
            messageKey: { type: string, example: errors.UNAUTHENTICATED }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                required: [path, code]
                properties:
                  path: { type: string }
                  code: { type: string }
