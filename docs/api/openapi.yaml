          description: The triggers
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReminderRule' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/settings/reminders/{kind}:
    put:
      tags: [settings]
      summary: Changes one trigger's days and on/off (R1-13)
      description: Needs `criteria:configure`. Audited (`reminder_rule.updated`) with the admin's name.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            {
              type: string,
              enum: [review_overdue, return_overdue, deadline_approaching, upload_due, flag_open],
            }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [days, enabled]
              properties:
                days: { type: integer, minimum: 1, maximum: 30 }
                enabled: { type: boolean }
      responses:
        '200':
          description: The trigger as saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderRule' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/settings/criteria:
    get:
      tags: [settings]
      summary: The active criteria version (R1-05)
      description: Needs `criteria:configure`.
      responses:
        '200':
          description: The active version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CriteriaSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [settings]
      summary: Publishes the edited criteria as the next version (R1-05)
      description: >
        Needs `criteria:configure`. `version` is the active version that was edited (409 `version`
        `stale` otherwise). The list becomes the next version in its order (1–10): a criterion
        with a `code` keeps it (an unknown code is 400 `criteria` `mismatch`); one left out is
        removed; one without a `code` is added with the next code never used before (ADR-016).
        File types carry over (a new criterion takes the current ones'). Requests already
        created keep their version. Audited (`criteria_set.published`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, criteria]
              properties:
                version: { type: integer, minimum: 1 }
                criteria:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [name, description, justificationRequired, evidencePolicy, maxFileMb]
                    properties:
                      code:
                        type: string
                        pattern: '^C[0-9]{1,2}$'
                        description: An existing criterion's code; leave out for a new criterion. Unique in the list
                      threshold: { $ref: '#/components/schemas/NullableThreshold' }
                      name:
                        type: object
                        required: [en]
                        properties:
                          en: { type: string, minLength: 1, maxLength: 120 }
                          ar: { type: string, maxLength: 120 }
                      description:
                        type: object
                        required: [en]
                        properties:
                          en: { type: string, minLength: 1, maxLength: 1000 }
                          ar: { type: string, maxLength: 1000 }
                      justificationRequired: { type: boolean }
                      evidencePolicy: { type: string, enum: [required, optional, none] }
                      maxFileMb: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '200':
          description: The new active version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CriteriaSettings' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/analytics/increments:
    get:
      tags: [analytics]
      summary: TAT and back-and-forth by period and subsidiary (R1-11, R1-12)
      description: >
        Needs `report:read_operational` in group scope (Sirius HR); a subsidiary is 403. Elapsed
        days with one decimal, open items measured to now (ADR-006). No pay, no employee names.
      parameters:
        - { $ref: '#/components/parameters/CycleFilter' }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - name: criterion
          in: query
          description: A criterion code (DASH-D3 filter); narrows criterion TAT and the trend
          schema: { type: string, pattern: '^C[0-9]{1,2}$' }
      responses:
        '200':
          description: The measures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementAnalytics' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/reports/tat-back-and-forth:
