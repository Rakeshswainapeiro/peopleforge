openapi: 3.1.0
info:
  title: PeopleForge API
  version: 0.16.0
  description: >
    Phase 1 API (BRD SIRIUS-HR-BRD-001). Every /api/v1 route requires an access token from the
    Sirius identity provider (Microsoft Entra ID; Keycloak locally) sent as
    `Authorization: Bearer <token>`. Tokens must be issued for this API (audience), by the
    configured issuer and tenant, and unexpired; anything else is 401. When the identity
    provider cannot be reached the API answers 503 so clients retry.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: group-data
    description: R2 group employee data, uploads, versions, raw extract (R2-01 … R2-04, R2-08, R2-14)
  - name: data-quality
    description: R2 anomaly rules and flags (R2-09 … R2-11, DASH-D7)
  - name: group-dashboards
    description: R2 group dashboards from per-department totals (R2-05, R2-07, DASH-D5, D6, D8)
  - name: increment-requests
    description: R1 Increment Request Portal
  - name: notifications
    description: In-app notifications (R1-07, R1-13)
  - name: reports
    description: Increment reports as Excel and PDF (R1-14)
  - name: audit
    description: The audit trail (R1-15, NFR-AUD-01)
  - name: settings
    description: Criteria and reminder triggers (R1-05, R1-13, NFR-CFG-01)
  - name: analytics
    description: TAT and back-and-forth for Sirius HR (R1-11, R1-12; DASH-D3, DASH-D4)
  - name: health
  - name: identity
paths:
  /health/live:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liveness' }
  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: 503 when any dependency is down or the instance is shutting down.
      security: []
      responses:
        '200':
          description: Ready for traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /api/v1/me:
    get:
      tags: [identity]
      summary: Current caller's identity, data scope, visible subsidiaries and effective permissions (R1-01, R2-12)
      responses:
        '200':
          description: Authenticated principal with permissions derived from its roles
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Principal' }
                  - type: object
                    required: [permissions, entities]
                    properties:
                      permissions:
                        type: array
                        items: { type: string, example: 'increment_request:decide' }
                      entities:
                        description: Subsidiaries the caller can see (all for Sirius roles), ordered by code
                        type: array
                        items: { $ref: '#/components/schemas/EntitySummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/IdentityProviderUnavailable' }
  /api/v1/increment-cycles/open:
    get:
      tags: [increment-requests]
      summary: Increment cycles open for requests (configuration, Q1)
      responses:
        '200':
          description: Open cycles, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Cycle' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/employees:
    get:
      tags: [increment-requests]
      summary: Employee picker for a request — name, number and grade, never salary (R1-02)
      description: Requires `increment_request:create`. A subsidiary user may only search their own subsidiaries (403 otherwise); Row-Level Security re-checks every row.
      parameters:
        - { name: entityId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: excludeRequestId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Up to 50 active employees, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EmployeeOption' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/increment-requests:
    get:
      tags: [increment-requests]
      summary: '"My increment requests", By request: newest first, filtered (R1-10)'
      description: >
        Requires `increment_request:read`. Drafts are listed only for callers who can create
        requests; Sirius sees a request once it is submitted. Each item carries its stage, its
        criteria progress and when its status last changed (the Age).
      parameters:
        - { $ref: '#/components/parameters/CycleFilter' }
        - {
            name: status,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [draft, submitted, under_review, returned, approved, partly_approved, rejected],
              },
          }
        - {
            name: entityId,
            in: query,
            description: 'One subsidiary (Request Tracker)',
            schema: { type: string, format: uuid },
          }
        - { $ref: '#/components/parameters/SearchFilter' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50], default: 10 } }
        - name: order
          in: query
          description: By creation time; `oldest` lists the longest-waiting first ("Needs your action")
          schema: { type: string, enum: [newest, oldest], default: newest }
      responses:
        '200':
          description: A page of summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementRequestPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [increment-requests]
      summary: Create a draft request with its first employee(s) (R1-02)
      description: >
        Requires `increment_request:create`. Idempotent per user and `Idempotency-Key`: repeating the
        call returns the same draft. `entityId` is required only when the caller acts for more than
        one subsidiary. Each employee's grade and monthly salary are snapshotted.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cycleId, employeeIds]
              properties:
                cycleId: { type: string, format: uuid }
                entityId: { type: string, format: uuid }
                employeeIds:
                  { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } }
      responses:
        '201':
          description: The draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/increment-requests/summary:
    get:
      tags: [increment-requests]
      summary: Counts for the dashboard's cards and tabs (R1-10)
      description: >
        `byStatus` counts the cycle's requests per status (every status present, zero when none),
        ignoring the status and search filters; `requests` and `employees` count what matches
        every filter.
      parameters:
        - { $ref: '#/components/parameters/CycleFilter' }
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted] } }
        - { $ref: '#/components/parameters/SearchFilter' }
      responses:
        '200':
          description: The counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/increment-request-lines:
    get:
      tags: [increment-requests]
      summary: '"My increment requests", By employee (R1-10)'
      description: >
        Requires `increment_request:read`. One item per employee in the caller's requests, with
        the proposed percentage and a mark per criterion. No salaries (data minimisation): the
        request itself has the money.
      parameters:
        - { $ref: '#/components/parameters/CycleFilter' }
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted] } }
        - { $ref: '#/components/parameters/SearchFilter' }
        - { name: requestId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50], default: 10 } }
      responses:
        '200':
          description: A page of employees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestLinePage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/increment-requests/{id}:
    get:
      tags: [increment-requests]
      summary: One request with derived figures and totals (R1-02)
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/increment-requests/{id}/lines:
    post:
      tags: [increment-requests]
      summary: Add an employee to a draft (snapshot of grade and salary)
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employeeId]
              properties: { employeeId: { type: string, format: uuid } }
      responses:
        '201':
          description: The updated request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/increment-requests/{id}/lines/{lineId}:
    delete:
      tags: [increment-requests]
      summary: Remove an employee from a draft (soft delete); removing the last one discards the draft
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: '`discarded: false` with the updated request, or `discarded: true` and `request: null` when the last employee was removed'
          content:
            application/json:
              schema:
                type: object
                required: [discarded, request]
                properties:
                  discarded: { type: boolean }
                  request:
                    oneOf:
                      - { $ref: '#/components/schemas/IncrementRequest' }
                      - { type: 'null' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/increment-requests/{id}/draft:
    put:
      tags: [increment-requests]
      summary: Save draft — proposals, and optionally one employee's criteria, all or nothing (R1-02, R1-03)
      description: >
        `version` must be the version last read (409 if the draft changed). A proposal value is a
        decimal string with up to 2 decimals: a percentage (above 0, at most 100) or a monthly
        amount (above 0, at most the current salary); `kind` and `value` both null clear it.
        `assessment` saves one employee's criteria: a result (`pass`, `fail` or null) and a
        justification (≤ 2,000 characters; empty clears it) per criterion of the request's set.
        Refusals name the field, e.g. `proposals.2.value` (`over_limit`, `not_positive`),
        `assessment.lineId` or `assessment.results.1.criterionId` (`not_found`).
        Replaces `PUT …/proposals` (never released).
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, proposals]
              properties:
                version: { type: integer, minimum: 1 }
                proposals:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [lineId, kind, value]
                    properties:
                      lineId: { type: string, format: uuid }
                      kind: { type: [string, 'null'], enum: [percent, amount, null] }
                      value: { $ref: '#/components/schemas/NullableDecimal' }
                assessment:
                  type: object
                  additionalProperties: false
                  required: [lineId, results]
                  properties:
                    lineId: { type: string, format: uuid }
                    results:
                      type: array
                      maxItems: 10
                      description: Each criterion at most once
                      items:
                        type: object
                        additionalProperties: false
                        required: [criterionId, result, justification]
                        properties:
                          criterionId: { type: string, format: uuid }
                          result:
                            type: [string, 'null']
                            enum: [pass, fail, null]
                            description: Ignored for a criterion with a threshold (the value decides, R1-05)
                          measuredValue:
                            type: [string, 'null']
                            pattern: '^\d{1,6}(\.\d{1,2})?$'
                            description: The employee's measured value for a criterion with a threshold (R1-05); stored encrypted
                          justification: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: The updated request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/increment-requests/{id}/evidence:
    post:
      tags: [increment-requests]
      summary: Attach an evidence file to one employee's criterion (R1-04, ADR-010)
      description: >
        Needs `increment_request:create`; drafts only. The file is checked in this order and
        stored only if every check passes: employee and criterion in the request, criterion
        accepts files, at most 5 live files, size (at most 10 MB or the criterion's lower
        limit; 413), type detected from the content and in the criterion's list
        (`file`/`media_type`), malware scan (`file`/`infected`). Scanner or storage unavailable:
        503, nothing stored. Doesn't change the request's `version`.
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [lineId, criterionId, file]
              properties:
                lineId: { type: string, format: uuid }
                criterionId: { type: string, format: uuid }
                file:
                  { type: string, format: binary, description: 'One file; the name may be UTF-8' }
      responses:
        '201':
          description: The recorded file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceFile' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/IdentityProviderUnavailable' }
  /api/v1/increment-requests/{id}/evidence/{evidenceId}:
    get:
      tags: [increment-requests]
      summary: Download an evidence file (always an attachment; re-checks access every time)
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: >
            The file, with its detected `Content-Type`, `Content-Disposition: attachment`
            (`filename*` in UTF-8), `Cache-Control: private, no-store` and
            `X-Content-Type-Options: nosniff`
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/IdentityProviderUnavailable' }
    delete:
      tags: [increment-requests]
      summary: Remove an evidence file from a draft (soft delete)
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/increment-requests/{id}/submit:
    post:
      tags: [increment-requests]
      summary: Submit a draft to Sirius HR (R1-07)
      description: >
        Needs `increment_request:submit`. `version` must be the version last read (409 if the draft
        changed). Refused with 400 when an employee has no proposal or an incomplete criterion
        (`lines.N`/`incomplete`), or when the cycle's submission deadline (a business day in
        Asia/Dubai) has passed (`cycle`/`deadline_passed`). On success, in one transaction: the
        status becomes `submitted`, a status event and an audit record are written, and the
        submitter and Sirius HR reviewers are notified (in-app; email queued in the outbox).
        Idempotent per user and `Idempotency-Key`: a repeat returns the submitted request; the same
        key on another request is 409 (`Idempotency-Key`/`reused`). Submitting a request that is no
        longer a draft is 409 (`status`/`not_draft`).
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties: { version: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The submitted request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncrementRequest' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/increment-requests/{id}/lines/{lineId}/verifications/{criterionId}:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
      - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: criterionId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [review]
      summary: Mark one criterion verified for one employee (R1-07, R1-10)
      description: >
        Needs `increment_request:review`. Moves a submitted request under review. Harmless when
        already verified. Notifies the submitter when the stage moves. 409 when the employee is
        decided or returned (`lineId`/`not_pending`) or the request is not in review
        (`status`/`not_in_review`). Audited.
      responses:
        '200':
          {
            description: The request,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/IncrementRequest' } } },
          }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [review]
      summary: Undo a verification
      description: Needs `increment_request:review`. Same rules as verifying. Audited.
      responses:
        '200':
          {
            description: The request,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/IncrementRequest' } } },
          }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/increment-requests/{id}/lines/{lineId}/decision:
    post:
      tags: [review]
      summary: Approve, reject or return one employee (R1-08, R1-09)
      description: >
        Needs `increment_request:decide`. Approving needs every criterion verified (409
        `criteria`/`not_verified`). The request's status follows (under review, returned, or final
        once every employee is decided). The submitter is notified; a return asks for action.
        Idempotent per user and `Idempotency-Key`. Comments and approved values are stored
        encrypted. Audited.
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DecideLine' } } }
      responses:
        '200':
          {
            description: The request,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/IncrementRequest' } } },
          }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/increment-requests/{id}/decision:
    post:
      tags: [review]
      summary: Decide every employee still waiting at once (R1-09)
      description: >
        Needs `increment_request:decide`. One decision, reason and comment for each employee still
        waiting, at the proposed increments (another percentage is decided per employee).
        Approving needs every criterion verified for each (409 `criteria`/`not_verified`, naming
        the first); nobody waiting is 409 `lineId`/`not_pending`. One transaction, one status
        change; the submitter gets one notification (`employees_approved|rejected|returned`) with
        the count. Idempotent per user and `Idempotency-Key`. Audited per employee
        (`allRemaining: true`).
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [decision]
                  properties:
                    decision: { const: approved }
                    comment: { type: string, maxLength: 2000 }
                - type: object
                  additionalProperties: false
                  required: [decision, reasonCode, comment]
                  properties:
                    decision: { enum: [rejected, returned] }
                    reasonCode: { type: string }
                    comment: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          {
            description: The request,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/IncrementRequest' } } },
          }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/increment-requests/{id}/resubmit:
    post:
      tags: [review]
      summary: Send the returned employees back to Sirius HR (R1-08)
      description: >
        Needs `increment_request:submit` (subsidiary HR; own subsidiary by Row-Level Security).
        Each returned employee needs a proposal and every criterion complete (400 `lines.N`/
        `incomplete`). Their verifications are cleared, so Sirius HR checks them again. The note
        is kept on the status history. Reviewers are notified. Version-checked and idempotent;
        409 `status`/`not_returned` when nothing is returned.
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          {
            description: The request,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/IncrementRequest' } } },
          }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/review-queue:
    get:
      tags: [review]
      summary: Sirius HR's Review queue (R1-07)
      description: >
        Needs `increment_request:review`. Employees of submitted requests across subsidiaries,
        oldest waiting first, with counts per filter. `overdue`: pending longer than the reminder
        time (`reminderDays`, calendar days). Percentages only, never salaries.
      parameters:
        - { $ref: '#/components/parameters/CycleFilter' }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/SearchFilter' }
        - {
            name: filter,
            in: query,
            schema:
              { type: string, enum: [pending, returned, overdue, open, all], default: pending },
          }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50], default: 10 } }
      responses:
        '200':
          {
            description: A page of employees,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ReviewQueuePage' } } },
          }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/increment-requests/{id}/lines/{lineId}/messages:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
      - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [conversations]
      summary: An employee's questions and answers, oldest first (R1-08)
      description: Needs `increment_request:read` and the request visible to the caller (Row-Level Security).
      responses:
        '200':
          description: The thread
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Message' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [conversations]
      summary: Ask (Sirius HR) or answer (the subsidiary) about an employee (R1-08)
      description: >
        Sirius HR reviewers (`increment_request:review`, group scope) ask; the subsidiary's HR
        (`increment_request:submit`) answers; anyone else is 403. Only while the request is in
        review (409 `status`/`not_in_review`). The other side is notified with action needed.
        Stored encrypted, append-only; audited without the text. Idempotent per user and key.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties: { body: { type: string, minLength: 1, maxLength: 2000 } }
      responses:
        '200':
          description: The thread, with the new message
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Message' } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/conversations:
    get:
      tags: [conversations]
      summary: Threads the caller can see, latest first (R1-08)
      description: >
        Needs `increment_request:read`. `awaiting` (default) lists threads whose latest message is
        from the other side; `counts` gives both totals for the chips.
      parameters:
        - {
            name: filter,
            in: query,
            schema: { type: string, enum: [awaiting, all], default: awaiting },
          }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50], default: 10 } }
      responses:
        '200':
          description: A page of threads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/reports/increment-requests:
    get:
      tags: [reports]
      summary: RP-01, the increment status report, as Excel or PDF (R1-14)
      description: >
        Needs `report:read_operational`, and `increment_request:read` with
        `employee_data:read_compensation` (the report holds increments): admins and executives
        get 403. The caller's own requests (Row-Level Security; drafts only for those who prepare
        them) with the dashboard's filters; at most 20,000 employees (the Summary says when cut).
        Labels in `locale`; dates in Asia/Dubai; text cells neutralised against formula
        injection. Every download is recorded in the audit trail (`report.downloaded`, with the
        format, row count and filters). Never cached.
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, pdf] } }
        - { name: locale, in: query, schema: { type: string, enum: [en, ar], default: en } }
        - { $ref: '#/components/parameters/CycleFilter' }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - {
            name: status,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [draft, submitted, under_review, returned, approved, partly_approved, rejected],
              },
          }
        - { $ref: '#/components/parameters/SearchFilter' }
      responses:
        '200':
          description: The file, as an attachment named `PeopleForge-RP-01-YYYY-MM-DD.xlsx|pdf`
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/reports/rp-03:
