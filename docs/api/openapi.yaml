      summary: RP-02, TAT and back-and-forth, as Excel (R1-11, R1-12, R1-14)
      description: >
        As `/analytics/increments`, as a workbook (Summary with the definitions; TAT by request,
        criterion and subsidiary; back-and-forth by request and subsidiary) in `locale`. Audited
        (`report.downloaded`, subject `RP-02`). Never cached.
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx] } }
        - { name: locale, in: query, schema: { type: string, enum: [en, ar], default: en } }
        - { $ref: '#/components/parameters/CycleFilter' }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The file, as an attachment named `PeopleForge-RP-02-YYYY-MM-DD.xlsx`
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: The caller's notifications, newest first
      description: >
        Any signed-in user. Includes notifications addressed to the caller and, for Sirius roles,
        those addressed to one of the caller's roles. Params carry display values only (reference,
        counts, names) — never pay or justifications.
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, unread, action_needed], default: all }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses:
        '200':
          description: A page of notifications with the unread count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/notifications/summary:
    get:
      tags: [notifications]
      summary: The unread count for the sidebar bell
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties: { unread: { type: integer, minimum: 0 } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/notifications/read:
    post:
      tags: [notifications]
      summary: Mark notifications as read — the given ones, or all of the caller's
      description: Ids the caller can't see are ignored. Repeating the call is harmless.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids:
                  { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        '204': { description: Marked }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/group/template:
    get:
      tags: [group-data]
      summary: The active field template (R2-01, R2-02)
      description: Needs `employee_data:read`. Placeholder fields until Sirius HR agrees the list (BRD A3).
      responses:
        '200':
          description: The template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldTemplate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/group/template/file:
    get:
      tags: [group-data]
      summary: The template as Excel, to fill in (R2-01)
      parameters:
        - { name: locale, in: query, schema: { type: string, enum: [en, ar], default: en } }
      responses:
        '200':
          description: '`PeopleForge-employee-data-template-vN.xlsx` (attachment, never cached)'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/group/uploads:
    get:
      tags: [group-data]
      summary: Uploads, newest first (R2-01, R2-04)
      description: Needs `employee_data:read`; subsidiary HR see their own subsidiaries (RLS, R2-12).
      parameters:
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - { name: period, in: query, schema: { $ref: '#/components/schemas/Period' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50], default: 10 } }
      responses:
        '200':
          description: A page of uploads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [group-data]
      summary: Upload a subsidiary's employee data for a month (R2-01)
      description: >
        Needs `employee_data:upload` and the subsidiary in the caller's scope (403 otherwise).
        Multipart: `entityId`, `period` (not a future month) and one `file` ≤ 5 MB, Excel (.xlsx,
        by magic bytes; macros, formulas and zip bombs refused) or UTF-8 CSV named .csv, ≤ 10,000
        rows. Scanned for malware before it is read. A file with errors is recorded as `rejected`
        with its problems (by row and field, never values) and changes nothing; a valid file is
        compared with the previous month, checked by the anomaly rules, and becomes the next
        version in use. The same file as the version in use is refused (409 `duplicate_file`).
        Sirius HR reviewers are notified; the uploader owns any flags raised.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [entityId, period, file]
              properties:
                entityId: { type: string, format: uuid }
                period: { $ref: '#/components/schemas/Period' }
                file: { type: string, format: binary }
      responses:
        '201':
          description: The upload, accepted or rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /api/v1/group/uploads/{id}:
    get:
      tags: [group-data]
      summary: One upload, with up to 200 problems (R2-01, R2-09)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The upload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/group/uploads/{id}/issues:
    get:
      tags: [group-data]
      summary: An upload's problem report as Excel (R2-01)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: locale, in: query, schema: { type: string, enum: [en, ar], default: en } }
      responses:
        '200':
          description: '`UP-NNNN-problems.xlsx`'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/group/uploads/{id}/file:
    get:
      tags: [group-data]
      summary: The file as uploaded (R2-08); audited (`group_upload.downloaded`)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The original file (attachment, never cached)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/group/employees:
    get:
      tags: [group-data]
      summary: The records in use for a month (R2-03, R2-04)
      description: Pay only with `employee_data:read_compensation` (null otherwise).
      parameters:
        - {
            name: period,
            in: query,
            required: true,
            schema: { $ref: '#/components/schemas/Period' },
          }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - { name: department, in: query, schema: { type: string, maxLength: 80 } }
        - { $ref: '#/components/parameters/SearchFilter' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50], default: 25 } }
      responses:
        '200':
          description: A page of records with the cards' counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/group/employees/{id}/history:
    get:
      tags: [group-data]
      summary: One employee across months and versions, with what changed (R2-04, R2-13)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Every version, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeHistory' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/group/extract:
    get:
      tags: [group-data]
      summary: RP-08 raw data extract (R2-08, R2-14)
      description: >
        Needs `employee_data:extract_raw`. The rows as uploaded with subsidiary, month, upload,
        version, uploader, time and file; `palmhr` heads the template fields with their mapped
        Palm HR names. CSV is UTF-8 with a BOM; text neutralised against formula injection.
        Audited (`group_data.extracted`, subject `RP-08`).
      parameters:
        - {
            name: format,
            in: query,
            required: true,
            schema: { type: string, enum: [xlsx, csv, palmhr] },
          }
        - {
            name: period,
            in: query,
            required: true,
            schema: { $ref: '#/components/schemas/Period' },
          }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - {
            name: allVersions,
            in: query,
            schema: { type: string, enum: ['true', 'false'], default: 'false' },
          }
        - { name: locale, in: query, schema: { type: string, enum: [en, ar], default: en } }
      responses:
        '200':
          description: '`PeopleForge-RP-08-YYYY-MM.xlsx|.csv|-palm-hr.csv`'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/group/overview:
    get:
      tags: [group-dashboards]
      summary: Group overview for a month (DASH-D5)
      description: >
        Needs `employee_data:read`. Headcount, joiners, leavers, turnover, gender, age bands,
        departments, grades and the 12-month trend, from the version in use per subsidiary.
        Subsidiary HR see their own subsidiary only (R2-12); another subsidiary's ID is 403.
      parameters:
        - {
            name: period,
            in: query,
            required: true,
            schema: { $ref: '#/components/schemas/Period' },
          }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - { name: department, in: query, schema: { type: string, minLength: 1, maxLength: 80 } }
      responses:
        '200':
          description: The overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupOverview' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/group/compensation:
    get:
      tags: [group-dashboards]
      summary: Compensation trends for a month (DASH-D6)
      description: >
        Needs `employee_data:read_compensation`. Payroll per currency (never added across
        currencies), the 12-month trend, average per grade against its band, and increments
        approved in the Increment Portal in the period's year with their cost. Totals only.
      parameters:
        - {
            name: period,
            in: query,
            required: true,
            schema: { $ref: '#/components/schemas/Period' },
          }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - { name: department, in: query, schema: { type: string, minLength: 1, maxLength: 80 } }
      responses:
        '200':
          description: Compensation figures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Compensation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/group/executive:
    get:
      tags: [group-dashboards]
      summary: Executive / IHC view for a month (DASH-D8, R2-07)
      description: >
        Needs `report:read_executive` and group scope. Group totals and per-subsidiary totals,
        missing uploads and open flags. No names and no individual pay.
      parameters:
        - {
            name: period,
            in: query,
            required: true,
            schema: { $ref: '#/components/schemas/Period' },
          }
      responses:
        '200':
          description: The executive view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutiveView' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/group/flags:
    get:
      tags: [data-quality]
      summary: Anomaly flags with counts, by subsidiary, and the month's variations (DASH-D7)
      description: Needs `employee_data:read`; values hidden without compensation access.
      parameters:
        - { name: period, in: query, schema: { $ref: '#/components/schemas/Period' } }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, resolved] } }
        - { name: rule, in: query, schema: { type: string, pattern: '^ANM-\\d{2}$' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: A page of flags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlagPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/group/flags/{id}:
    get:
      tags: [data-quality]
      summary: One flag with its activity, neighbours and possible owners (R2-11)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlagDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [data-quality]
      summary: Owner, status and resolution note (R2-11)
      description: >
        Needs `anomaly:resolve`. Resolving needs a note (400 `note_required`); the owner must be
        someone who uploaded the subsidiary's data, a current owner, or the caller. A flag closed
        because its data was replaced can't change (409 `superseded`). The owner is notified
        unless they made the change. Audited without the note's text.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFlag' }
      responses:
        '200':
          description: The flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flag' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/group/flags/{id}/remind:
    post:
      tags: [data-quality]
      summary: Send the owner a reminder (Sirius HR, R2-11)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Reminder queued (in-app and email) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/settings/template:
    get:
      tags: [group-data]
      summary: The field template, for admins (`template:configure`)
      responses:
        '200':
          description: The template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldTemplate' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [group-data]
      summary: Publish the next template version (R2-02, R2-14)
      description: >
        Core fields keep their key and type and can't be removed; dashboard fields stay required;
        keys are unique; list fields need allowed values (400 otherwise). A stale version is 409.
        Audited (`field_template.published`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishTemplate' }
      responses:
        '200':
          description: The new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldTemplate' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/settings/anomaly-rules:
    get:
      tags: [data-quality]
      summary: The anomaly rules (R2-10, `template:configure`)
      responses:
        '200':
          description: The rules
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AnomalyRule' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/settings/anomaly-rules/{code}:
    put:
      tags: [data-quality]
      summary: Turn a rule on or off and set its threshold (R2-10)
      parameters:
        - {
            name: code,
            in: path,
            required: true,
            schema: { type: string, pattern: '^ANM-\\d{2}$' },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [threshold, enabled]
              properties:
                threshold: { type: [string, 'null'], pattern: '^\\d{1,3}(\\.\\d{1,2})?$' }
                enabled: { type: boolean }
      responses:
        '200':
          description: The rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyRule' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        OIDC access token for audience `OIDC_AUDIENCE`, issued by `OIDC_ISSUER` (Entra ID in
        production, pending Sirius IT, A6; Keycloak locally). Roles come from the `roles` claim.
  parameters:
    RequestId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CycleFilter:
      name: cycleId
      in: query
      description: Increment cycle (the dashboard's Period); all cycles when left out
      schema: { type: string, format: uuid }
    SearchFilter:
      name: search
      in: query
      description: >
        Matches anywhere in an employee's name or number, or the request reference; case- and
        script-aware (NFC). `%` and `_` are literal. Empty means no search.
      schema: { type: string, maxLength: 100 }
  headers:
    RequestId:
      description: Correlation ID, echoed or generated per request.
      schema: { type: string }
  responses:
    IdentityProviderUnavailable:
      description: A dependency is unavailable (identity provider signing keys, the database, object storage or the malware scanner); retry later
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthenticated:
      description: Missing, malformed, expired or foreign access token
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationFailed:
      description: Input refused; `details` name the fields
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: The caller's role lacks the permission, or the subsidiary isn't theirs
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Doesn't exist, or isn't visible to the caller (another subsidiary's, or a draft for Sirius)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Stale `version`, duplicate employee, no active criteria set, the criterion's file limit reached (`file`/`limit`), a request that is no longer a draft (`status`/`not_draft`), or an `Idempotency-Key` reused for another request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PayloadTooLarge:
      description: Body or file over the limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    Period:
      type: string
      pattern: '^20\\d{2}-(0[1-9]|1[0-2])$'
      description: A month of data, as at its end ("2026-09").
    TemplateField:
      type: object
      required: [key, label, type, required, core, allowedValues, palmHrField]
      properties:
        key: { type: string }
        label: { $ref: '#/components/schemas/LocalisedText' }
        type: { type: string, enum: [text, date, decimal, enum] }
        required: { type: boolean }
        core: { type: boolean, description: Fixed key and type (dashboards rely on it) }
        allowedValues: { type: array, items: { type: string } }
        palmHrField: { type: [string, 'null'], description: Mapped Palm HR field (R2-14, A7) }
    FieldTemplate:
      type: object
      required: [id, version, activatedAt, fields]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        activatedAt: { type: [string, 'null'], format: date-time }
        fields: { type: array, items: { $ref: '#/components/schemas/TemplateField' } }
    PublishTemplate:
      type: object
      additionalProperties: false
      required: [version, fields]
      properties:
        version: { type: integer, minimum: 1, description: The version being replaced }
        fields:
          type: array
          minItems: 1
          maxItems: 60
          items:
            type: object
            additionalProperties: false
            required: [key, label, type, required, allowedValues, palmHrField]
            properties:
              key: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
              label: { $ref: '#/components/schemas/LocalisedText' }
              type: { type: string, enum: [text, date, decimal, enum] }
              required: { type: boolean }
              allowedValues: { type: array, maxItems: 50, items: { type: string, maxLength: 60 } }
              palmHrField: { type: [string, 'null'], maxLength: 60 }
    UploadIssue:
      type: object
      required: [row, field, code, severity]
      properties:
        row:
          { type: [integer, 'null'], description: Spreadsheet row (header = 1); null for the file }
        field: { type: [string, 'null'] }
        code:
          type: string
          enum:
            [
              unreadable,
              macros,
              too_large,
              empty_file,
              too_many_rows,
              missing_column,
              unknown_column,
              duplicate_column,
              formula,
              required,
              invalid_date,
              invalid_number,
              not_allowed,
              too_long,
              duplicate_employee,
              invalid_currency,
              left_without_date,
              future_date,
              date_order,
            ]
        severity: { type: string, enum: [error, warning] }
    UploadComparison:
      type: object
      description: Against the subsidiary's previous month in use (R2-09); counts and percentages only.
      required:
        [
          previousPeriod,
          headcount,
          previousHeadcount,
          payrollChangePercent,
          newRecords,
          left,
          missing,
          changed,
          warnings,
        ]
      properties:
        previousPeriod: { oneOf: [{ $ref: '#/components/schemas/Period' }, { type: 'null' }] }
        headcount: { type: integer }
        previousHeadcount: { type: [integer, 'null'] }
        payrollChangePercent:
          { type: [string, 'null'], description: Largest change of any currency, one decimal }
        newRecords: { type: integer }
        left: { type: integer }
        missing: { type: integer }
        changed: { type: integer }
        warnings: { type: array, items: { type: string, enum: [headcount_change, payroll_change] } }
    Upload:
      type: object
      required:
        [
          id,
          reference,
          entity,
          period,
          version,
          status,
          fileName,
          rows,
          errors,
          warnings,
          templateVersion,
          uploadedByName,
          uploadedAt,
          comparison,
          flags,
        ]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: UP-0007 }
        entity:
          {
            type: object,
            properties: { id: { type: string, format: uuid }, code: { type: string } },
          }
        period: { $ref: '#/components/schemas/Period' }
        version: { type: [integer, 'null'], description: Null when rejected }
        status: { type: string, enum: [rejected, accepted, superseded] }
        fileName: { type: string }
        rows: { type: integer }
        errors: { type: integer }
        warnings: { type: integer }
        templateVersion: { type: integer }
        uploadedByName: { type: string }
        uploadedAt: { type: string, format: date-time }
        comparison: { oneOf: [{ $ref: '#/components/schemas/UploadComparison' }, { type: 'null' }] }
        flags: { type: integer }
    UploadDetail:
      allOf:
        - { $ref: '#/components/schemas/Upload' }
        - type: object
          required: [issues, issuesTotal]
          properties:
            issues:
              { type: array, maxItems: 200, items: { $ref: '#/components/schemas/UploadIssue' } }
            issuesTotal: { type: integer }
    UploadPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Upload' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    EmployeeRecord:
      type: object
      description: One record in use (R2-04); the template's core fields plus `extra`.
      required:
        [
          id,
          entity,
          period,
          employeeNumber,
          fullName,
          department,
          grade,
          grossSalary,
          currency,
          dateJoined,
          gender,
          status,
          extra,
          upload,
        ]
      properties:
        id: { type: string, format: uuid }
        entity:
          {
            type: object,
            properties: { id: { type: string, format: uuid }, code: { type: string } },
          }
        period: { $ref: '#/components/schemas/Period' }
        employeeNumber: { type: string }
        fullName: { type: string }
        department: { type: string }
        designation: { type: [string, 'null'] }
        grade: { type: string }
        grossSalary:
          {
            oneOf: [{ $ref: '#/components/schemas/Decimal' }, { type: 'null' }],
            description: Null without compensation access,
          }
        currency: { type: string }
        dateJoined: { type: string, format: date }
        dateOfBirth: { type: [string, 'null'], format: date }
        gender: { type: string }
        nationality: { type: [string, 'null'] }
        status: { type: string }
        dateLeft: { type: [string, 'null'], format: date }
        costCentre: { type: [string, 'null'] }
        extra: { type: object, additionalProperties: { type: string } }
        upload:
          {
            type: object,
            properties:
              {
                id: { type: string, format: uuid },
                reference: { type: string },
                version: { type: integer },
              },
          }
    EmployeePage:
      type: object
      required: [items, page, pageSize, total, summary, departments]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EmployeeRecord' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        summary:
          type: object
          properties:
            entitiesWithData: { type: integer }
            entities: { type: integer }
            versions: { type: integer }
            lastChange: { type: [object, 'null'] }
        departments: { type: array, items: { type: string } }
    EmployeeHistory:
      type: object
      required: [employeeNumber, entity, versions]
      properties:
        employeeNumber: { type: string }
        entity: { type: object }
        versions:
          type: array
          items:
            type: object
            properties:
              period: { $ref: '#/components/schemas/Period' }
              upload: { type: object }
              record: { $ref: '#/components/schemas/EmployeeRecord' }
              changes:
                type: array
                items:
                  {
                    type: object,
                    properties:
                      {
                        field: { type: string },
                        before: { type: [string, 'null'] },
                        after: { type: [string, 'null'] },
                      },
                  }
    AnomalyRule:
      type: object
      required: [code, kind, threshold, enabled, updatedAt, updatedByName]
      properties:
        code: { type: string, example: ANM-03 }
        kind:
          {
            type: string,
            enum:
              [
                missing_employee,
                grade_change,
                salary_change,
                salary_stable_then_changed,
                increment_mismatch,
                outside_grade_band,
                duplicate_across_entities,
                headcount_change,
                payroll_change,
              ],
          }
        threshold: { type: [string, 'null'] }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
        updatedByName: { type: [string, 'null'] }
    Flag:
      type: object
      required: [id, reference, entity, period, upload, ruleCode, ruleKind, owner, status, detail]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: AN-0042 }
        entity: { type: object }
        period: { $ref: '#/components/schemas/Period' }
        upload: { type: object }
        ruleCode: { type: string }
        ruleKind: { type: string }
        employeeNumber: { type: [string, 'null'] }
        employeeName: { type: [string, 'null'] }
        field: { type: [string, 'null'] }
        detail:
          {
            type: object,
            additionalProperties: { type: string },
            description: Display values; empty without compensation access,
          }
        owner: { type: object, properties: { id: { type: string }, name: { type: string } } }
        status: { type: string, enum: [open, in_progress, resolved] }
        note: { type: [string, 'null'] }
        resolvedReason: { type: [string, 'null'], enum: [superseded, null] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    MoneyByCurrency:
      type: object
      additionalProperties: { $ref: '#/components/schemas/Decimal' }
      description: 'Amounts per currency code, e.g. {"AED": "1250000.00"}'
    EntityRef:
      type: object
      required: [id, code]
      properties: { id: { type: string, format: uuid }, code: { type: string } }
    Percent:
      type: [string, 'null']
      description: One decimal, e.g. "12.9"; null when not computable
    HeadcountTrend:
      type: array
      items:
        type: object
        required: [period, headcount]
        properties:
          period: { $ref: '#/components/schemas/Period' }
          headcount: { type: [integer, 'null'] }
    GroupOverview:
      type: object
      required:
        [
          period,
          previousPeriod,
          entities,
          entitiesWithData,
          headcount,
          previousHeadcount,
          joiners,
          leavers,
          turnoverPercent,
          female,
          femaleSharePercent,
          byEntity,
          byDepartment,
          gender,
          ageBands,
          grades,
          trend,
          departments,
        ]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        previousPeriod: { $ref: '#/components/schemas/Period' }
        entities: { type: integer }
        entitiesWithData: { type: integer }
        headcount: { type: integer }
        previousHeadcount: { type: [integer, 'null'] }
        joiners: { type: integer }
        leavers: { type: integer }
        turnoverPercent: { $ref: '#/components/schemas/Percent' }
        female: { type: integer }
        femaleSharePercent: { $ref: '#/components/schemas/Percent' }
        byEntity:
          type: array
          items:
            type: object
            required: [entity, headcount, joiners, leavers]
            properties:
              entity: { $ref: '#/components/schemas/EntityRef' }
              headcount: { type: integer }
              joiners: { type: integer }
              leavers: { type: integer }
        byDepartment:
          type: array
          items:
            {
              type: object,
              required: [department, headcount],
              properties: { department: { type: string }, headcount: { type: integer } },
            }
        gender:
          type: object
          required: [female, male, other]
          properties:
            { female: { type: integer }, male: { type: integer }, other: { type: integer } }
        ageBands:
          type: array
          items:
            type: object
            required: [band, count]
            properties:
              band: { type: string, enum: [under_25, 25_34, 35_44, 45_54, 55_plus, unknown] }
              count: { type: integer }
        grades:
          type: array
          items:
            {
              type: object,
              required: [grade, headcount],
              properties: { grade: { type: string }, headcount: { type: integer } },
            }
        trend: { $ref: '#/components/schemas/HeadcountTrend' }
        departments: { type: array, items: { type: string } }
    Compensation:
      type: object
      required: [period, previousPeriod, payroll, trend, grades, increments, departments]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        previousPeriod: { $ref: '#/components/schemas/Period' }
        payroll:
          type: array
          items:
            type: object
            required: [currency, amount, previousAmount, changePercent, headcount, average]
            properties:
              currency: { type: string }
              amount: { $ref: '#/components/schemas/Decimal' }
              previousAmount: { $ref: '#/components/schemas/NullableDecimal' }
              changePercent: { $ref: '#/components/schemas/Percent' }
              headcount: { type: integer }
              average: { $ref: '#/components/schemas/Decimal' }
        trend:
          type: array
          items:
            type: object
            required: [period, payroll]
            properties:
              period: { $ref: '#/components/schemas/Period' }
              payroll: { $ref: '#/components/schemas/MoneyByCurrency' }
        grades:
          type: array
          items:
            type: object
            required: [grade, currency, headcount, average, band]
            properties:
              grade: { type: string }
              currency: { type: string }
              headcount: { type: integer }
              average: { $ref: '#/components/schemas/Decimal' }
              band:
                type: [object, 'null']
                required: [min, max]
                properties:
                  {
                    min: { $ref: '#/components/schemas/Decimal' },
                    max: { $ref: '#/components/schemas/Decimal' },
                  }
        increments:
          type: object
          required: [approved, averagePercent, distribution, costImpact]
          properties:
            approved: { type: integer }
            averagePercent: { $ref: '#/components/schemas/Percent' }
            distribution:
              type: array
              items:
                type: object
                required: [bucket, count]
                properties:
                  bucket: { type: string, enum: [under_3, 3_5, 5_8, 8_10, 10_plus] }
                  count: { type: integer }
            costImpact:
              type: array
              items:
                type: object
                required: [entity, currency, employees, monthlyIncrease, annualIncrease]
                properties:
                  entity: { $ref: '#/components/schemas/EntityRef' }
                  currency: { type: string }
                  employees: { type: integer }
                  monthlyIncrease: { $ref: '#/components/schemas/Decimal' }
                  annualIncrease: { $ref: '#/components/schemas/Decimal' }
        departments: { type: array, items: { type: string } }
    ExecutiveView:
      type: object
      required:
        [
          period,
          previousPeriod,
          entities,
          entitiesWithData,
          headcount,
          previousHeadcount,
          joiners,
          leavers,
          turnoverPercent,
          femaleSharePercent,
          payroll,
          byEntity,
          trend,
          openFlags,
        ]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        previousPeriod: { $ref: '#/components/schemas/Period' }
        entities: { type: integer }
        entitiesWithData: { type: integer }
        headcount: { type: integer }
        previousHeadcount: { type: [integer, 'null'] }
        joiners: { type: integer }
        leavers: { type: integer }
        turnoverPercent: { $ref: '#/components/schemas/Percent' }
        femaleSharePercent: { $ref: '#/components/schemas/Percent' }
        payroll:
          type: array
          items:
            type: object
            required: [currency, amount, changePercent]
            properties:
              currency: { type: string }
              amount: { $ref: '#/components/schemas/Decimal' }
              changePercent: { $ref: '#/components/schemas/Percent' }
        byEntity:
          type: array
          items:
            type: object
            required: [entity, headcount, payroll, openFlags, missing]
            properties:
              entity: { $ref: '#/components/schemas/EntityRef' }
              headcount: { type: integer }
              payroll: { $ref: '#/components/schemas/MoneyByCurrency' }
              openFlags: { type: integer }
              missing: { type: boolean, description: No accepted upload for the month }
        trend: { $ref: '#/components/schemas/HeadcountTrend' }
        openFlags: { type: integer }
    FlagPage:
      type: object
      required: [items, page, pageSize, total, counts, oldestOpenAt, rules, byEntity, variations]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Flag' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        counts:
          {
            type: object,
            properties:
              {
                open: { type: integer },
                in_progress: { type: integer },
                resolved: { type: integer },
              },
          }
        oldestOpenAt: { type: [string, 'null'], format: date-time }
        rules:
          {
            type: array,
            items: { type: object, properties: { code: { type: string }, kind: { type: string } } },
          }
        byEntity: { type: array, items: { type: object } }
        variations: { type: array, items: { type: object } }
    FlagDetail:
      type: object
      required: [flag, activity, previousId, nextId, owners]
      properties:
        flag: { $ref: '#/components/schemas/Flag' }
        activity:
          {
            type: array,
            items:
              {
                type: object,
                properties:
                  {
                    action: { type: string },
                    actorName: { type: [string, 'null'] },
                    at: { type: string, format: date-time },
                    details: { type: object },
                  },
              },
          }
        previousId: { type: [string, 'null'], format: uuid }
        nextId: { type: [string, 'null'], format: uuid }
        owners:
          {
            type: array,
            items: { type: object, properties: { id: { type: string }, name: { type: string } } },
          }
    UpdateFlag:
      type: object
      additionalProperties: false
      required: [ownerId, status, note]
      properties:
        ownerId: { type: [string, 'null'], description: Null keeps the owner }
        status: { type: string, enum: [open, in_progress, resolved] }
        note: { type: [string, 'null'], maxLength: 2000, description: Required to resolve }
    Decimal:
      type: string
      pattern: '^\d{1,9}(\.\d{1,2})?$'
      description: Exact decimal as a string (never a JSON number), e.g. "21500.00"
    NullableDecimal:
      type: [string, 'null']
      pattern: '^\d{1,9}(\.\d{1,2})?$'
    LocalisedText:
      type: object
      required: [en]
      properties: { en: { type: string }, ar: { type: string } }
    Cycle:
      type: object
      required: [id, name, startsOn, endsOn, submissionDeadline, status]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/LocalisedText' }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        submissionDeadline: { type: [string, 'null'], format: date }
        status: { type: string, enum: [planned, open, closed] }
    EmployeeOption:
      type: object
      required: [id, employeeNumber, fullName, grade]
      properties:
        id: { type: string, format: uuid }
        employeeNumber: { type: string }
        fullName: { type: string }
        grade: { type: string }
    RequestLine:
      type: object
      required:
        [
          id,
          employeeId,
          employeeNumber,
          fullName,
          grade,
          currency,
          currentSalary,
          proposedKind,
          proposedValue,
          increase,
          newSalary,
          percent,
          criteria,
          reviewStatus,
          decision,
        ]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeNumber: { type: string }
        fullName: { type: string }
        grade: { type: string }
        currency: { type: string, example: AED }
        currentSalary: { $ref: '#/components/schemas/Decimal' }
        proposedKind: { type: [string, 'null'], enum: [percent, amount, null] }
        proposedValue: { $ref: '#/components/schemas/NullableDecimal' }
        increase: { $ref: '#/components/schemas/NullableDecimal' }
        newSalary: { $ref: '#/components/schemas/NullableDecimal' }
        percent: { $ref: '#/components/schemas/NullableDecimal' }
        criteria:
          type: array
          description: One per criterion of the request, in the same order as the request's `criteria`
          items: { $ref: '#/components/schemas/CriterionAssessment' }
        reviewStatus: { type: string, enum: [pending, approved, rejected, returned] }
        decision:
          description: The latest decision on the employee; null while undecided (R1-09)
          oneOf:
            - type: 'null'
            - { $ref: '#/components/schemas/LineDecision' }
    Criterion:
      type: object
      required:
        [
          id,
          code,
          name,
          description,
          justificationRequired,
          evidencePolicy,
          allowedMediaTypes,
          maxFileMb,
          threshold,
        ]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: C1 }
        threshold: { $ref: '#/components/schemas/NullableThreshold' }
        name: { $ref: '#/components/schemas/LocalisedText' }
        description: { $ref: '#/components/schemas/LocalisedText' }
        justificationRequired: { type: boolean }
        evidencePolicy: { type: string, enum: [required, optional, none] }
        allowedMediaTypes: { type: array, items: { type: string }, example: [application/pdf] }
        maxFileMb: { type: integer, description: "Effective limit: the criterion's, capped at 10" }
    NullableThreshold:
      description: Passes on a measured value (R1-05, ADR-016); null for Pass or Fail by judgement
      oneOf:
        - type: 'null'
        - type: object
          additionalProperties: false
          required: [operator, value, unit]
          properties:
            operator: { type: string, enum: [gte, lte] }
            value: { type: string, pattern: '^\d{1,6}(\.\d{1,2})?$', example: '3.5' }
            unit: { type: string, enum: [rating, score, percent, months, years, days] }
    EvidenceFile:
      type: object
      required: [id, fileName, mediaType, sizeBytes, createdAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    CriterionAssessment:
      type: object
      required: [criterionId, result, measuredValue, justification, evidence, missing, verification]
      properties:
        criterionId: { type: string, format: uuid }
        result: { type: [string, 'null'], enum: [pass, fail, null] }
        measuredValue:
          type: [string, 'null']
          description: The measured value for a criterion with a threshold (R1-05); null otherwise
        justification: { type: string }
        evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceFile' } }
        missing:
          type: array
          description: What still stops the criterion counting as complete (R1-06); empty when complete
          items: { type: string, enum: [result, justification, evidence] }
        verification:
          description: Sirius HR's check of the criterion ("Mark verified"); null until verified
          oneOf:
            - type: 'null'
            - type: object
              required: [at, byName]
              properties:
                at: { type: string, format: date-time }
                byName: { type: string }
    Message:
      type: object
      required: [id, side, authorName, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        side: { type: string, enum: [sirius, subsidiary] }
        authorName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    ConversationPage:
      type: object
      required: [items, page, pageSize, total, counts]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        counts:
          type: object
          required: [all, awaiting]
          properties: { all: { type: integer }, awaiting: { type: integer } }
        items:
          type: array
          items:
            type: object
            required: [lineId, request, employeeNumber, fullName, messages, awaitingMe, last]
            properties:
              lineId: { type: string, format: uuid }
              request:
                type: object
                required: [id, reference, entityCode]
                properties:
                  id: { type: string, format: uuid }
                  reference: { type: string }
                  entityCode: { type: string }
              employeeNumber: { type: string }
              fullName: { type: string }
              messages: { type: integer, minimum: 1 }
              awaitingMe:
                { type: boolean, description: 'The latest message is from the other side' }
              last:
                type: object
                required: [side, authorName, createdAt, preview]
                properties:
                  side: { type: string, enum: [sirius, subsidiary] }
                  authorName: { type: string }
                  createdAt: { type: string, format: date-time }
                  preview: { type: string, maxLength: 160 }
    LineDecision:
      type: object
      required:
        [
          decision,
          reasonCode,
          comment,
          approvedPercent,
          approvedIncrease,
          approvedSalary,
          decidedAt,
          decidedByName,
        ]
      properties:
        decision: { type: string, enum: [approved, rejected, returned] }
        reasonCode:
          type: [string, 'null']
          enum:
            [
              criteria_not_met,
              missing_evidence,
              budget,
              policy,
              other,
              unclear_justification,
              proposal_change,
              policy_band,
              internal_equity,
              null,
            ]
        comment:
          { type: string, description: "The reviewer's comment or question; empty when none" }
        approvedPercent:
          {
            $ref: '#/components/schemas/NullableDecimal',
            description: 'Set when approved at another percentage than proposed',
          }
        approvedIncrease: { $ref: '#/components/schemas/NullableDecimal' }
        approvedSalary: { $ref: '#/components/schemas/NullableDecimal' }
        decidedAt: { type: string, format: date-time }
        decidedByName: { type: string }
    DecideLine:
      description: >
        Approve as proposed (`{decision: approved}`), or at another percentage with a change reason
        and a comment; reject or return with that decision's reason and a comment (≤ 2,000).
      oneOf:
        - type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision: { type: string, const: approved }
            approvedPercent:
              { type: string, pattern: '^\d{1,9}(\.\d{1,2})?$', description: '> 0 and ≤ 100' }
            reasonCode: { type: string, enum: [budget, policy_band, internal_equity, other] }
            comment: { type: string, maxLength: 2000 }
        - type: object
          additionalProperties: false
          required: [decision, reasonCode, comment]
          properties:
            decision: { type: string, const: rejected }
            reasonCode:
              { type: string, enum: [criteria_not_met, missing_evidence, budget, policy, other] }
            comment: { type: string, minLength: 1, maxLength: 2000 }
        - type: object
          additionalProperties: false
          required: [decision, reasonCode, comment]
          properties:
            decision: { type: string, const: returned }
            reasonCode:
              {
                type: string,
                enum: [missing_evidence, unclear_justification, proposal_change, other],
              }
            comment: { type: string, minLength: 1, maxLength: 2000 }
    ReviewQueuePage:
      type: object
      required: [items, page, pageSize, total, counts, reminderDays]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        reminderDays:
          {
            type: integer,
            description: 'Days a pending employee may wait before it is past reminder time',
          }
        counts:
          type: object
          required: [all, pending, returned, overdue, open, openRequests, openEntities]
          properties:
            all: { type: integer }
            pending: { type: integer }
            returned: { type: integer }
            overdue: { type: integer }
            open: { type: integer }
            openRequests: { type: integer }
            openEntities: { type: integer }
        items:
          type: array
          items:
            type: object
            required:
              [
                lineId,
                request,
                employeeNumber,
                fullName,
                grade,
                proposedPercent,
                criteria,
                verified,
                reviewStatus,
                waitingSince,
                overdue,
              ]
            properties:
              lineId: { type: string, format: uuid }
              request:
                type: object
                required: [id, reference, status, entity, stage]
                properties:
                  id: { type: string, format: uuid }
                  reference: { type: string }
                  status:
                    {
                      type: string,
                      enum:
                        [
                          draft,
                          submitted,
                          under_review,
                          returned,
                          approved,
                          partly_approved,
                          rejected,
                        ],
                    }
                  entity:
                    type: object
                    required: [id, code]
                    properties: { id: { type: string, format: uuid }, code: { type: string } }
                  stage: { $ref: '#/components/schemas/RequestStage' }
              employeeNumber: { type: string }
              fullName: { type: string }
              grade: { type: string }
              proposedPercent: { $ref: '#/components/schemas/NullableDecimal' }
              criteria:
                type: array
                items:
                  type: object
                  required: [criterionId, code, mark]
                  properties:
                    criterionId: { type: string, format: uuid }
                    code: { type: string }
                    mark: { type: string, enum: [pass, fail, pending] }
              verified:
                { type: integer, description: 'Criteria Sirius HR has verified for this employee' }
              reviewStatus: { type: string, enum: [pending, approved, rejected, returned] }
              waitingSince: { type: string, format: date-time }
              overdue: { type: boolean }
    IncrementRequest:
      type: object
      required:
        [
          id,
          reference,
          status,
          entity,
          cycle,
          criteria,
          version,
          createdAt,
          updatedAt,
          submittedAt,
          submittedByName,
          statusChangedAt,
          decidedAt,
          stage,
          lines,
          totals,
        ]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: INC-2026-0001 }
        status:
          {
            type: string,
            enum: [draft, submitted, under_review, returned, approved, partly_approved, rejected],
          }
        entity: { $ref: '#/components/schemas/EntitySummary' }
        cycle:
          type: object
          required: [id, name, submissionDeadline]
          properties:
            id: { type: string, format: uuid }
            name: { $ref: '#/components/schemas/LocalisedText' }
            submissionDeadline:
              type: [string, 'null']
              format: date
              description: Last business day (Asia/Dubai) on which requests can be submitted
        criteria:
          type: array
          description: The criteria set pinned when the request was created (R1-05), in display order
          items: { $ref: '#/components/schemas/Criterion' }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        submittedByName:
          type: [string, 'null']
          maxLength: 200
          description: The submitter's name as it was at submit time; null for drafts and requests submitted before it was kept
          example: Priya Nair
        statusChangedAt: { type: string, format: date-time }
        decidedAt:
          type: [string, 'null']
          format: date-time
          description: When the last employee was decided (final status); null until then
        stage: { $ref: '#/components/schemas/RequestStage' }
        lines: { type: array, items: { $ref: '#/components/schemas/RequestLine' } }
        totals:
          type: object
          required: [employees, proposed, ready, increaseByCurrency, averagePercent]
          properties:
            employees: { type: integer }
            proposed: { type: integer }
            ready:
              type: integer
              description: Employees with a proposal and every criterion complete
            increaseByCurrency:
              type: array
              items:
                type: object
                required: [currency, amount]
                properties:
                  { currency: { type: string }, amount: { $ref: '#/components/schemas/Decimal' } }
            averagePercent: { $ref: '#/components/schemas/NullableDecimal' }
    IncrementRequestPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            required:
              [
                id,
                reference,
                status,
                entity,
                cycleId,
                employeeCount,
                createdAt,
                submittedAt,
                statusChangedAt,
                stage,
                criteria,
              ]
            properties:
              id: { type: string, format: uuid }
              reference: { type: string }
              status:
                {
                  type: string,
                  enum:
                    [draft, submitted, under_review, returned, approved, partly_approved, rejected],
                }
              entity:
                type: object
                required: [id, code]
                properties: { id: { type: string, format: uuid }, code: { type: string } }
              cycleId: { type: string, format: uuid }
              employeeCount: { type: integer }
              createdAt: { type: string, format: date-time }
              submittedAt: { type: [string, 'null'], format: date-time }
              statusChangedAt:
                { type: string, format: date-time, description: 'Last status change (Age)' }
              stage: { $ref: '#/components/schemas/RequestStage' }
              criteria:
                type: object
                description: Criteria complete across the request's employees, e.g. 15 of 20
                required: [complete, total]
                properties: { complete: { type: integer }, total: { type: integer } }
    RequestStage:
      description: >
        Where the request stands in Sirius HR's review (R1-10, ADR-013): not submitted; at the
        first criterion not yet verified for every employee still in review; at the decision once
        all are verified; decided once final. `of` is the criteria count.
      oneOf:
        - type: object
          required: [kind, of]
          properties:
            kind: { type: string, enum: [not_submitted, decision, decided] }
            of: { type: integer, minimum: 0 }
        - type: object
          required: [kind, criterion, of]
          properties:
            kind: { type: string, const: criterion }
            criterion: { type: integer, minimum: 1 }
            of: { type: integer, minimum: 1 }
    DashboardSummary:
      type: object
      required: [byStatus, requests, employees, funnel]
      properties:
        funnel:
          type: object
          description: >
            The stage funnel (DASH-D2): submitted requests at each criterion (index 0 = criterion
            1), at the decision, and decided; ignores the status and search filters
          required: [criteria, decision, withSubsidiary, decided]
          properties:
            criteria: { type: array, items: { type: integer } }
            decision: { type: integer }
            withSubsidiary:
              type: integer
              description: Open requests whose every remaining employee is returned to the subsidiary
            decided: { type: integer }
        byStatus:
          type: object
          required: [draft, submitted, under_review, returned, approved, partly_approved, rejected]
          properties:
            draft: { type: integer }
            submitted: { type: integer }
            under_review: { type: integer }
            returned: { type: integer }
            approved: { type: integer }
            partly_approved: { type: integer }
            rejected: { type: integer }
        requests: { type: integer }
        employees: { type: integer }
    RequestLinePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            required:
              [
                id,
                request,
                employeeNumber,
                fullName,
                grade,
                proposedPercent,
                criteria,
                status,
                updatedAt,
              ]
            properties:
              id: { type: string, format: uuid }
              request:
                type: object
                required: [id, reference, status, entityCode]
                properties:
                  id: { type: string, format: uuid }
                  reference: { type: string }
                  status:
                    {
                      type: string,
                      enum:
                        [
                          draft,
                          submitted,
                          under_review,
                          returned,
                          approved,
                          partly_approved,
                          rejected,
                        ],
                    }
                  entityCode: { type: string }
              employeeNumber: { type: string }
              fullName: { type: string }
              grade: { type: string }
              proposedPercent: { $ref: '#/components/schemas/NullableDecimal' }
              criteria:
                type: array
                items:
                  type: object
                  required: [criterionId, code, mark]
                  properties:
                    criterionId: { type: string, format: uuid }
                    code: { type: string }
                    mark:
                      type: string
                      enum: [pass, fail, pending]
                      description: Pass or fail once complete; pending until then
              status:
                type: string
                enum:
                  [draft, submitted, under_review, returned, approved, partly_approved, rejected]
                description: The request's status
              reviewStatus:
                type: string
                enum: [pending, approved, rejected, returned]
                description: The employee's own place in the review (R1-09)
              updatedAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, at, actor, actorName, action, entityId, subjectType, subjectId, details]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string, description: The actor's user ID }
        actorName:
          type: [string, 'null']
          description: The actor's name as recorded (null for entries before 0.11)
        action: { type: string, examples: [increment_request.submitted, report.downloaded] }
        entityId: { type: [string, 'null'], format: uuid }
        subjectType: { type: string }
        subjectId: { type: string }
        details:
          type: object
          description: Flat values only (IDs, codes, counts); never pay or text
          additionalProperties: { type: [string, number, boolean, 'null'] }
    AuditTrailPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    ReminderRule:
      type: object
      required: [kind, days, enabled, updatedAt, updatedByName]
      properties:
        kind:
          {
            type: string,
            enum: [review_overdue, return_overdue, deadline_approaching, upload_due, flag_open],
          }
        days: { type: integer, minimum: 1, maximum: 30 }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
        updatedByName: { type: [string, 'null'] }
    CriteriaSettings:
      type: object
      required: [id, version, activatedAt, criteria]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        activatedAt: { type: [string, 'null'], format: date-time }
        criteria: { type: array, items: { $ref: '#/components/schemas/Criterion' } }
    Days:
      type: string
      pattern: '^\d+\.\d$'
      description: Elapsed days with one decimal (ADR-006)
      example: '2.5'
    IncrementAnalytics:
      type: object
      required: [generatedAt, tat, backAndForth]
      properties:
        generatedAt: { type: string, format: date-time }
        tat:
          type: object
          description: >
            Request TAT (submission → decision, or now), criterion TAT (waiting since submission
            or resubmission → verification), by criterion, subsidiary and request (longest first).
          properties:
            requests: { type: integer }
            decided: { type: integer }
            averageDays: { oneOf: [{ $ref: '#/components/schemas/Days' }, { type: 'null' }] }
            medianDays: { oneOf: [{ $ref: '#/components/schemas/Days' }, { type: 'null' }] }
            open: { type: integer }
            openAverageDays: { oneOf: [{ $ref: '#/components/schemas/Days' }, { type: 'null' }] }
            longestOpen: { type: [object, 'null'] }
            byCriterion:
              type: array
              description: 'Per criterion (filtered by `criterion`): verified, average, median and longest days'
              items: { type: object }
            trend:
              type: array
              description: >
                The 12 months up to now (Asia/Dubai): decided requests' TAT by decision month, or
                with a criterion filter that criterion's TAT by verification month (DASH-D3)
              items:
                type: object
                required: [month, count, averageDays, medianDays]
                properties:
                  month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
                  count: { type: integer }
                  averageDays: { oneOf: [{ $ref: '#/components/schemas/Days' }, { type: 'null' }] }
                  medianDays: { oneOf: [{ $ref: '#/components/schemas/Days' }, { type: 'null' }] }
            criteria:
              { type: array, items: { type: string }, description: Criterion codes for the filter }
            byEntity: { type: array, items: { type: object } }
            byRequest: { type: array, items: { type: object } }
        backAndForth:
          type: object
          description: >
            Returns (time with the subsidiary until resubmission, or now) and questions (to the
            subsidiary's next message), by subsidiary and request.
          properties:
            returns: { type: integer }
            openReturns: { type: integer }
            averageReturnDays: { oneOf: [{ $ref: '#/components/schemas/Days' }, { type: 'null' }] }
            questions: { type: integer }
            averageAnswerDays: { oneOf: [{ $ref: '#/components/schemas/Days' }, { type: 'null' }] }
            byEntity: { type: array, items: { type: object } }
            byRequest: { type: array, items: { type: object } }
    Notification:
      type: object
      required: [id, kind, requestId, params, actionNeeded, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum:
            [
              request_submitted,
              request_received,
              stage_changed,
              employee_approved,
              employee_rejected,
              employee_returned,
              employees_approved,
              employees_rejected,
              employees_returned,
              request_decided,
              request_resubmitted,
              question_asked,
              question_answered,
              review_overdue,
              return_overdue,
              deadline_approaching,
              group_upload_accepted,
              group_flags_raised,
              flag_updated,
              flag_reminder,
              upload_due,
              flag_open,
            ]
          description: >
            What happened (review_overdue, return_overdue, deadline_approaching, upload_due and
            flag_open are reminders, R1-13, R2-11); clients word it in the reader's language
        requestId: { type: [string, 'null'], format: uuid }
        params:
          type: object
          additionalProperties: { type: [string, number] }
          example: { reference: INC-2026-0005, employees: 1, entity: SUB-A, actor: Alpha HR }
        actionNeeded: { type: boolean }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    NotificationPage:
      type: object
      required: [items, page, pageSize, total, unread]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        unread: { type: integer }
    Liveness:
      type: object
      required: [status]
      properties:
        status: { type: string, const: alive }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [up, down] }
    Principal:
      oneOf:
        - type: object
          required: [userId, username, name, roles, scope]
          properties:
            userId: { type: string, description: Identity-provider object ID (Entra oid) }
            username: { type: [string, 'null'] }
            name: { type: [string, 'null'] }
            roles: { type: array, items: { type: string } }
            scope: { type: string, const: group }
        - type: object
          required: [userId, username, name, roles, scope, entityIds]
          properties:
            userId: { type: string, description: Identity-provider object ID (Entra oid) }
            username: { type: [string, 'null'] }
            name: { type: [string, 'null'] }
            roles: { type: array, items: { type: string } }
            scope: { type: string, const: entity }
            entityIds: { type: array, items: { type: string } }
    EntitySummary:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: SUB-A }
        name:
          type: object
          description: Localised names keyed by locale; `en` always present
          required: [en]
          additionalProperties: { type: string }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, messageKey, requestId]
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION_FAILED,
                  UNAUTHENTICATED,
                  FORBIDDEN,
                  NOT_FOUND,
                  CONFLICT,
                  PAYLOAD_TOO_LARGE,
                  RATE_LIMITED,
                  SERVICE_UNAVAILABLE,
                  INTERNAL_ERROR,
                ]
            messageKey: { type: string, example: errors.UNAUTHENTICATED }
            requestId: { type: string }
            details:
              type: array
              items:
                type: object
                required: [path, code]
                properties:
                  path: { type: string }
                  code: { type: string }
