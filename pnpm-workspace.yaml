packages:
  - 'apps/*'
  - 'packages/*'

# Only packages that genuinely need install scripts may run them (supply-chain hardening).
onlyBuiltDependencies:
  - esbuild
  - sharp

# exceljs 4.4.0 pins uuid 8 (GHSA-w5hq-g745-h8pq, moderate); it only calls `v4()`, which uuid 11
# keeps. Patched version forced here; remove when exceljs updates its dependency.
overrides:
  exceljs>uuid: 11.1.1

# Audit exceptions — each must be justified and dated in SECURITY.md ("Accepted advisories").
# CI fails on any other high/critical finding.
auditConfig:
  ignoreGhsas:
    # braces (dev-only, via @next/eslint-plugin-next > fast-glob). No patched version exists.
    # Not in any runtime image; inputs are our own lint globs. Review by 2026-11-06.
    - GHSA-vfj7-8cjw-p6xm
